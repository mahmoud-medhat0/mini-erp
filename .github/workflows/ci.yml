name: CI

# Verifies the active Laravel ERP under laravel/.
#
# The legacy Next.js/Prisma app under app/ is historical reference only and is
# deliberately not built or tested here.

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: laravel

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "22"

jobs:
  # Static quality gates. Fast, no database.
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint (code style)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: laravel/package-lock.json

      - run: npm ci

      - name: Validate locale dictionaries parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('resources/js/locales/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('resources/js/locales/ar.json','utf8'))"

      - name: Assert EN and AR dictionaries have identical key sets
        run: node scripts/check-locale-parity.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # PHPUnit on SQLite (:memory:), matching phpunit.xml.
  # Split into batches because one monolithic run is slow and hides which area broke.
  tests:
    name: PHPUnit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: invariants-unit-integration
            args: "--testsuite=Invariants,Unit,Integration"
          - suite: accounting-ar-ap
            args: "--filter=(AccountingCore|AccountCategory|AccountType|Phase2|Phase3|Phase5)"
          - suite: sales-purchasing-inventory
            args: "--filter=(Phase4|Phase10)"
          - suite: assets-tax-expense-payroll
            args: "--filter=(Phase6|Phase7|Phase11|Phase12|Phase13)"
          - suite: rentals-projects-reports
            args: "--filter=(Phase14|Phase16|DataTable|ReportInputHardening)"
          - suite: hardening-acceptance-security
            args: "--filter=(Phase15|Phase17|Phase18|Phase19|Phase20|Security|M8|M9|M10|Migrated|Settings|GoLive|HealthCheck)"
          # Everything the batches above do not name. Keeps new test files from
          # silently escaping CI: a file matching no batch lands here by default.
          - suite: foundation-auth-rbac-and-remainder
            args: >-
              --filter=/^(?!.*(AccountingCore|AccountCategory|AccountType|Phase2|Phase3|Phase4|Phase5|Phase6|Phase7|Phase10|Phase11|Phase12|Phase13|Phase14|Phase15|Phase16|Phase17|Phase18|Phase19|Phase20|DataTable|ReportInputHardening|Security|M8|M9|M10|Migrated|Settings|GoLive|HealthCheck)).*$/
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test ${{ matrix.args }}

  # PostgreSQL-backed checks. Migrations, route authorization, and the
  # concurrency/stress commands only prove anything on the real engine.
  postgres:
    name: PostgreSQL migrations, security audit, concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: mini_erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mini_erp_ci
      DB_USERNAME: erp
      DB_PASSWORD: erp
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Assert no pending migrations
        run: php artisan migrate:status

      - name: Seed baseline accounting data
        run: php artisan db:seed --class=DatabaseSeeder --force

      - name: Strict route authorization audit
        run: php artisan security:route-audit --strict

      - name: Operational readiness checks
        run: php artisan ops:go-live-readiness

      - name: Concurrency test suite
        run: php artisan test --testsuite=Concurrency

      - name: Sequence and idempotency stress
        run: php artisan concurrency:stress --workers=50

      - name: Core accounting posting stress
        run: php artisan accounting:concurrency-stress --workers=25

      - name: AR/AP allocation and settlement stress
        run: |
          php artisan accounting:allocation-concurrency-stress --workers=25
          php artisan accounting:settlement-concurrency-stress --workers=25

      - name: Inventory and stock transfer stress
        run: |
          php artisan accounting:inventory-concurrency-stress --workers=25
          php artisan accounting:stock-transfer-stress --workers=25

      - name: Subledger integrity check
        run: php artisan accounting:phase3-integrity-check

      - name: Bounded token garbage collection
        run: php artisan tokens:gc --batch=100

  # Browser smoke coverage. Catches defects server-side tests structurally cannot
  # see: a page that returns 200 but throws in React, or a broken asset bundle.
  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: mini_erp_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mini_erp_e2e
      DB_USERNAME: erp
      DB_PASSWORD: erp
      E2E_EMAIL: e2e-admin@mini-erp.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: laravel/package-lock.json

      - run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --class=DatabaseSeeder --force

      - name: Build assets
        run: npm run build

      - name: Provision the browser-test account
        # Generated per run; never a committed credential.
        run: |
          E2E_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$E2E_PASSWORD"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          php artisan e2e:prepare-user --email="$E2E_EMAIL" --password="$E2E_PASSWORD"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            laravel/storage/e2e/report
            laravel/storage/e2e/test-results
          retention-days: 7

  # Guards that keep architectural decisions from silently regressing.
  source-scans:
    name: Anti-tenancy and hardcoded-value scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tenant/company scope reintroduced
        # database/migrations is excluded on purpose: the historical migrations that
        # *removed* company_id / tenant_id must keep naming those columns.
        # Phase3IntegrityCheckCommand is excluded because it is the runtime guard
        # that asserts those columns stay absent.
        run: |
          hits=$(grep -rInE "currentCompany|currentTenant|company_id|tenant_id" \
            app resources/js routes \
            --include=*.php --include=*.ts --include=*.tsx \
            | grep -v "Phase3IntegrityCheckCommand" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Multi-tenant scope detected. See NO_MULTI_TENANT_POLICY.md"
            exit 1
          fi
          echo "Clean: no tenant/company scope."

      - name: No Spatie Teams enabled
        run: |
          if grep -InE "^\s*'teams'\s*=>\s*true" config/permission.php; then
            echo "::error::Spatie Teams must stay disabled."
            exit 1
          fi
          echo "Clean: Spatie Teams disabled."

      - name: No float money math in application services
        run: |
          if grep -rInE "\(float\)|floatval|/ *100\b" app/Application --include=*.php; then
            echo "::error::Float money math detected. Money must stay integer minor units."
            exit 1
          fi
          echo "Clean: no float money math."
