name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint

  # Accounting-invariant suite + DB integration. Invariants BLOCK the pipeline.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: mini_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/mini_erp_test?schema=public
      AUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Sync schema to test DB
        run: npx prisma db push --skip-generate
      - name: Accounting invariants (blocking)
        run: npm run test:invariants
      - name: Full unit + integration tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: mini_erp_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/mini_erp_e2e?schema=public
      AUTH_SECRET: ci-test-secret
      AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Sync schema to E2E DB
        run: npx prisma db push --skip-generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke E2E
        run: npm run e2e
